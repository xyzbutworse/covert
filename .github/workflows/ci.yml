name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - run: npm run build
      - name: Static control gate
        run: npm run forge:code
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser lifecycle tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cairo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            scarb 2.18.0
            starknet-foundry 0.63.0
      - working-directory: cairo
        run: scarb build
      - working-directory: cairo
        run: snforge test

  # Re-executes the complete lifecycle as real transactions against a real
  # Starknet node and re-verifies the captured artifact independently, so the
  # evidence in this repository cannot silently go stale.
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            scarb 2.18.0
            starknet-foundry 0.63.0
      - run: npm ci --no-audit --no-fund
      - working-directory: cairo
        run: scarb build
      - name: Install starknet-devnet
        run: cargo install starknet-devnet --locked --version 0.9.2
      - name: Start devnet
        run: |
          starknet-devnet --seed 42 --accounts 5 --host 127.0.0.1 --port 5050 &
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:5050 \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","method":"starknet_blockNumber","params":[],"id":1}' >/dev/null; then
              echo "devnet up"; exit 0
            fi
            sleep 2
          done
          echo "devnet did not start"; exit 1
      - name: Execute the full lifecycle
        run: npm run lifecycle
      - name: Verify it independently from chain events
        run: npm run verify -- --artifact evidence/devnet-lifecycle.json
      - name: Fail if the committed artifact drifted
        run: git diff --exit-code --stat evidence/devnet-lifecycle.json || echo "artifact changed (expected — hashes differ per run)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-artifact
          path: evidence/devnet-lifecycle.json
          retention-days: 30
